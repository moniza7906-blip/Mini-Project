<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan Your Trip | Varanasi Heritage</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f1e8;
            color: #3d241c;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #4d2220;
            color: white;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .home-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link:hover {
            color: #f5a623;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            text-align: center;
            padding: 65px 20px 45px;
            background: linear-gradient(
                rgba(60, 25, 20, 0.9),
                rgba(60, 25, 20, 0.9)
            );
            color: white;
        }

        .hero h1 {
            font-size: 46px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
        }

        .highlight {
            color: #f5a623;
        }

        /* =========================
           FORM CONTAINER
        ========================= */

        .container {
            max-width: 900px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #4d2220;
        }

        /* =========================
           FORM
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #d88918;
        }

        /* =========================
           INTERESTS
        ========================= */

        .interests {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .interest {
            border: 1px solid #ddd;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            background: #fafafa;
        }

        .interest:hover {
            border-color: #d88918;
        }

        .interest input {
            margin-right: 5px;
        }

        /* =========================
           BUTTON
        ========================= */

        .plan-btn {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: #d88918;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .plan-btn:hover {
            background: #b86f0d;
        }

        /* =========================
           INFO
        ========================= */

        .info {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .interests {
                grid-template-columns: 1fr 1fr;
            }

            .card {
                padding: 25px;
            }
        }

    </style>

</head>


<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <div class="logo">
            🛕 Varanasi Heritage
        </div>

        <a href="index.html" class="home-link">
            ← Back to Home
        </a>

    </nav>


    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

        <h1>
            Plan Your <span class="highlight">Varanasi Trip</span>
        </h1>

        <p>
            Choose your budget, duration and interests.
            We'll create your complete Varanasi experience.
        </p>

    </section>


    <!-- =========================
         FORM
    ========================= -->

    <main class="container">

        <div class="card">

            <h2>
                ✨ Create Your Trip
            </h2>


            <form id="tripForm">

                <div class="form-grid">


                    <!-- BUDGET -->

                    <div class="form-group">

                        <label for="budget">
                            💰 Your Budget
                        </label>

                        <select id="budget" required>

                            <option value="">
                                Select your budget
                            </option>

                            <option value="5000">
                                ₹5,000
                            </option>

                            <option value="10000">
                                ₹10,000
                            </option>

                            <option value="20000">
                                ₹20,000
                            </option>

                            <option value="30000">
                                ₹30,000+
                            </option>

                        </select>

                    </div>


                    <!-- DURATION -->

                    <div class="form-group">

                        <label for="days">
                            📅 Trip Duration
                        </label>

                        <select id="days" required>

                            <option value="">
                                Select duration
                            </option>

                            <option value="1">
                                1 Day
                            </option>

                            <option value="2">
                                2 Days
                            </option>

                            <option value="3">
                                3 Days
                            </option>

                            <option value="4">
                                4 Days
                            </option>

                            <option value="5">
                                5 Days
                            </option>

                        </select>

                    </div>


                    <!-- PEOPLE -->

                    <div class="form-group">

                        <label for="people">
                            👥 Number of People
                        </label>

                        <input
                            type="number"
                            id="people"
                            min="1"
                            max="20"
                            placeholder="e.g. 2"
                            required
                        >

                    </div>


                    <!-- TRAVEL STYLE -->

                    <div class="form-group">

                        <label for="style">
                            ✈️ Travel Style
                        </label>

                        <select id="style" required>

                            <option value="">
                                Select travel style
                            </option>

                            <option value="budget">
                                Budget Friendly
                            </option>

                            <option value="balanced">
                                Balanced
                            </option>

                            <option value="premium">
                                Premium
                            </option>

                        </select>

                    </div>


                    <!-- INTERESTS -->

                    <div class="form-group full">

                        <label>
                            🛕 What are you interested in?
                        </label>

                        <div class="interests">

                            <label class="interest">
                                <input
                                    type="checkbox"
                                    value="Temples"
                                    name="interest"
                                >
                                🛕 Temples
                            </label>

                            <label class="interest">
                                <input
                                    type="checkbox"
                                    value="Ghats"
                                    name="interest"
                                >
                                🌊 Ghats
                            </label>

                            <label class="interest">
                                <input
                                    type="checkbox"
                                    value="Culture"
                                    name="interest"
                                >
                                🎭 Culture
                            </label>

                            <label class="interest">
                                <input
                                    type="checkbox"
                                    value="Food"
                                    name="interest"
                                >
                                🍛 Food
                            </label>

                            <label class="interest">
                                <input
                                    type="checkbox"
                                    value="Shopping"
                                    name="interest"
                                >
                                🛍️ Shopping
                            </label>

                            <label class="interest">
                                <input
                                    type="checkbox"
                                    value="Spirituality"
                                    name="interest"
                                >
                                🪔 Spirituality
                            </label>

                        </div>

                    </div>


                </div>


                <button
                    type="submit"
                    class="plan-btn"
                >
                    🚀 Generate My Varanasi Trip
                </button>


            </form>


            <p class="info">
                Your trip will include suggested accommodation,
                transportation, attractions, food experiences and
                cultural activities.
            </p>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        document
            .getElementById("tripForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const budget =
                    document.getElementById("budget").value;

                const days =
                    document.getElementById("days").value;

                const people =
                    document.getElementById("people").value;

                const style =
                    document.getElementById("style").value;


                const interests =
                    Array.from(
                        document.querySelectorAll(
                            'input[name="interest"]:checked'
                        )
                    ).map(function(item) {
                        return item.value;
                    });


                if (interests.length === 0) {

                    alert(
                        "Please select at least one interest."
                    );

                    return;

                }


                const trip = {

                    budget: budget,

                    days: days,

                    people: people,

                    style: style,

                    interests: interests

                };


                localStorage.setItem(
                    "varanasiTrip",
                    JSON.stringify(trip)
                );


                window.location.href = "trip.html";

            });

    </script>

</body>

</html>
